name: Documentation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs once the repository is public; until then verification runs locally.
  # The documentation itself is published by https://offerrall.github.io from docs/.
  documentation:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check operation coverage, example previews and the generated docs
        run: node tools/examples.mjs --check
